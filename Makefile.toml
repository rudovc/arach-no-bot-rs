[tasks.format]
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--", "--emit=files"]

[tasks.clean]
command = "cargo"
args = ["clean", "--release"]

[tasks.build]
command = "cargo"
args = ["build"]

[tasks.build-rad]
command = "cargo"
args = ["build", "--profile", "dev-rad"]

[tasks.debug]
dependencies = ["build-rad"]
command = "sh"
args = ["-c", "if command -v raddbg >/dev/null 2>&1; then raddbg --project:./.raddbg target/dev-rad/arachnobot; else cargo make debug-cli; fi"]

[tasks.debug-cli]
dependencies = ["build-rad"]
command = "sh"
args = ["-c", "if command -v nnd >/dev/null 2>&1; then nnd target/dev-rad/arachnobot; elif command -v gdb >/dev/null 2>&1; then gdb target/dev-rad/arachnobot; elif command -v lldb >/dev/null 2>&1; then lldb target/dev-rad/arachnobot; else echo 'No CLI debugger found.' >&2; exit 1; fi"]

[tasks.test-prod]
command = "cargo"
args = ["test"]

[tasks.test-staging]
command = "cargo"
args = ["test", "--features=staging"]

[tasks.test]
dependencies = ["test-staging", "test-prod"]

[tasks.run-staging]
command = "cargo"
args = ["run", "--features=staging"]

[tasks.dev-staging]
command = "cargo"
args = ["run", "--features=staging"]
watch = true

[tasks.check-licenses]
command = "cargo"
args = ["license", "-o", "licenses.txt"]

[tasks.check-deps]
command = "cargo"
args = ["deny", "check"]

[tasks.check]
dependencies = ["check-licenses", "check-deps"]
